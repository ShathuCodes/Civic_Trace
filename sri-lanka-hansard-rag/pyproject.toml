[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sri-lanka-hansard-rag"
version = "1.0.0"
description = "Multilingual Sri Lankan Parliament Hansard pipeline and retrieval-augmented question answering system."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [
    {name = "Data Engineering Team", email = "info@civictrace.local"}
]
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "playwright>=1.40.0",
    "tenacity>=8.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.2.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.2.0",
    "regex>=2024.4.16",
    "ftfy>=6.2.0",
    "orjson>=3.10.0",
    "pandas>=2.2.0",
    "langdetect>=1.0.9",
    "qdrant-client>=1.9.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "sentence-transformers>=2.6.0",
]

[project.scripts]
hansard-rag = "hansard_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
